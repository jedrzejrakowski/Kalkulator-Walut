name: CI

on:
  pull_request:
  push:
    branches: [main]

# Nowy push do gałęzi unieważnia poprzedni, jeszcze trwający przebieg.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testy:
    name: Testy i build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalacja zależności
        run: npm ci

      - name: Kontrola typów
        run: npx tsc -b && npx tsc -p vps

      - name: Testy logiki podatkowej
        run: npm test

      - name: Build produkcyjny
        run: npm run build

  wdrozenie:
    name: Wdrożenie na VPS
    needs: testy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalacja zależności
        run: npm ci

      - name: Build produkcyjny
        run: npm run build

      - name: Konfiguracja SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 179.198.212.201 >> ~/.ssh/known_hosts

      - name: Wysyłka na serwer
        run: rsync -az --delete dist/ deploy@179.198.212.201:/srv/apps/kalkulator/
